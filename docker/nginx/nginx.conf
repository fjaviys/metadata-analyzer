# Metadata Analyzer — Nginx proxy inverso (HTTP/HTTPS + WebSocket)

upstream ma_backend  { server backend:8000; }
upstream ma_frontend { server frontend:4321; }

# Cabeceras para WebSocket (upgrade)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- HTTP: redirige a HTTPS ---
server {
    listen 80;
    server_name _;

    # Permitir health-check en claro
    location = /health {
        proxy_pass http://ma_backend/health;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Subidas/lecturas grandes (vídeos): límite alto
    client_max_body_size 2048m;

    # API REST del backend
    location /api/ {
        proxy_pass http://ma_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # análisis largos
        proxy_send_timeout 3600s;
    }

    # WebSocket de progreso
    location /ws/ {
        proxy_pass http://ma_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Documentación OpenAPI del backend
    location /docs      { proxy_pass http://ma_backend/docs; }
    location /openapi.json { proxy_pass http://ma_backend/openapi.json; }

    # Frontend (Astro SSR) — todo lo demás
    location / {
        proxy_pass http://ma_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;         # HMR/websocket de Astro en dev
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Metadata Analyzer — orquestación completa
# Levantar:  docker compose up -d
# Ver logs:  docker compose logs -f backend
#
# SEGURIDAD: la carpeta de medios se monta en el backend en SOLO LECTURA (:ro)
# por defecto. Solo cuando vayas a ejecutar correcciones REALES, cambia el modo a
# lectura/escritura siguiendo docs/DEPLOYMENT.md (variable MEDIA_READ_ONLY=false).

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ma-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # La carpeta de medios se monta en /media dentro del contenedor.
      ALLOWED_MEDIA_ROOTS: /media
      DATABASE_URL: sqlite:///data/db/metadata_analyzer.db
      BACKUP_DIR: data/backups
      LOG_DIR: data/logs
      REPORT_DIR: data/reports
      BACKUP_KEEP_LAST: ${BACKUP_KEEP_LAST:-10}
      CORRECTION_ERROR_ABORT_RATIO: ${CORRECTION_ERROR_ABORT_RATIO:-0.10}
      DATE_MIN_YEAR: ${DATE_MIN_YEAR:-1990}
      DATE_MAX_YEAR_OFFSET: ${DATE_MAX_YEAR_OFFSET:-5}
    volumes:
      # Medios: SOLO LECTURA por defecto. Para correcciones reales -> ':rw'.
      - type: bind
        source: ${MEDIA_HOST_PATH:-/srv/media}
        target: /media
        read_only: ${MEDIA_READ_ONLY:-true}
      # Datos persistentes (BD, backups, logs, informes)
      - ma-data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [ma-net]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ma-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4321"
    depends_on:
      backend:
        condition: service_healthy
    networks: [ma-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: ma-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks: [ma-net]

  # --- PostgreSQL (opcional; migración documentada en docs/DEPLOYMENT.md) ---
